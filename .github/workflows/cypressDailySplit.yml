# Nightly Cypress run, sharded across parallel jobs with cypress-split.
name: Cypress nightly split

# NOTE: run-name is evaluated before any job exists, so it can only use the
# github, inputs and vars contexts. Per-shard detail goes in the job name below.
run-name: "Cypress [${{ inputs.browser || 'chrome' }}] - Spec: ${{ inputs.spec || 'all' }}"

on:
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to use'
        required: false
        default: 'chrome'
        type: choice
        options:
          - chrome
          - electron
          - firefox
      spec:
        description: 'Spec pattern or single file to run (leave empty for full suite)'
        required: false
        default: ''
        type: string
      log_level:
        description: 'normal = quiet | verbose = action logs | debug = Cypress internals'
        required: false
        default: 'normal'
        type: choice
        options:
          - normal
          - verbose
          - debug
#  schedule:
#    - cron: '42 0 * * 1-6'
#      timezone: 'Europe/Paris'

permissions:
  contents: read

jobs:
  # Runs once before the shards: they share the same ic3 user and server, so a
  # cleanup done by a shard might delete the data of a test running in another one.
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    name: "cleanup"
    steps:

      - uses: actions/checkout@v7

      - name: Install dependencies
        run: npm install

      - name: "Cypress cleanup (AI conversations)"
        uses: cypress-io/github-action@v7
        with:
          install: false
          config-file: cypress.config-github.ts
          # Not matched by the regular specPattern (*.spec.ts).
          config: baseUrl=${{ secrets.CYPRESS_BASE_URL }},specPattern=cypress/cleanup/*.cleanup.ts
          browser: chrome
          summary-title: "cleanup"
        env:
          CYPRESS_ic3_user: ${{ secrets.IC3_USER }}
          CYPRESS_ic3_password: ${{ secrets.IC3_PASSWORD }}
          CYPRESS_GITHUB_ACTIONS: true
          CYPRESS_NO_PASSING: true

  build:
    needs: cleanup
    # A failed cleanup must not prevent the tests from running.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    # Each shard runs ~1/4 of the suite. Keep this close to the real worst case
    # so a hung run is killed quickly instead of burning runner time.
    timeout-minutes: 45
    name: "split ${{ matrix.split_index }}/${{ matrix.split_total }}"
    strategy:
      fail-fast: false
      matrix:
        # 4 parallel shards: 0, 1, 2, 3
        split_total: [4]
        split_index: [0, 1, 2, 3]
    env:
      # On a scheduled run the inputs context is empty, hence the fallback.
      LOG_LEVEL: ${{ inputs.log_level || 'normal' }}
    steps:

      - uses: actions/checkout@v7

      - name: Install dependencies
        run: npm install

      - name: "Cypress run (${{ inputs.browser || 'chrome' }})"
        uses: cypress-io/github-action@v7
        with:
          install: false
          config-file: cypress.config-github.ts
          config: baseUrl=${{ secrets.CYPRESS_BASE_URL }}
          browser: ${{ inputs.browser || 'chrome' }}
          spec: ${{ inputs.spec }}
          quiet: ${{ env.LOG_LEVEL == 'normal' }}
          summary-title: "split ${{ matrix.split_index }}"
        env:
          # Empty DEBUG means no debug output at all.
          # cypress:* is very noisy - narrow it to cypress:server:* if the
          # logs get truncated.
          DEBUG: ${{ env.LOG_LEVEL == 'debug' && '@cypress/github-action,cypress:*' || env.LOG_LEVEL == 'verbose' && '@cypress/github-action' || '' }}

          # cypress-split: SPLIT is the number of shards, SPLIT_INDEX this shard.
          SPLIT: ${{ matrix.split_total }}
          SPLIT_INDEX: ${{ matrix.split_index }}
          # The per-spec table: off for nightly runs, on when debugging.
          SPLIT_SUMMARY: ${{ env.LOG_LEVEL != 'normal' }}

          # ic3 related environment variables
          CYPRESS_ic3_user: ${{ secrets.IC3_USER }}
          CYPRESS_ic3_password: ${{ secrets.IC3_PASSWORD }}
          CYPRESS_GITHUB_ACTIONS: true
          CYPRESS_NO_PASSING: true

          # To record to Cypress Cloud, add `record: true` and
          # `ci-build-id: ${{ github.run_id }}-${{ github.run_attempt }}` under
          # `with:` above, then uncomment these. Without a shared ci-build-id the
          # four shards show up as four separate runs in the Cloud dashboard.
          # CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          # CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          # Artifact names must be unique within a run, hence the shard index.
          name: cypress-screenshots-split-${{ matrix.split_index }}
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload videos
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-videos-split-${{ matrix.split_index }}
          path: cypress/videos
          if-no-files-found: ignore
          retention-days: 7