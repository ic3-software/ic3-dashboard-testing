# This is a basic workflow that is manually triggered #

name: Cypress nightly split
on:
  workflow_dispatch:
    inputs:
      split_total:
        description: 'Total number of chunks (leave empty to not split)'
        required: false
        default: ''
        type: string
      split_index:
        description: 'Chunk index to run (0-based)'
        required: false
        default: ''
        type: string
      spec:
        description: 'Spec pattern or single file to run (leave empty for full suite)'
        required: false
        default: ''
        type: string
      browser:
        description: 'Browser to use'
        required: false
        default: 'chrome'
        type: choice
        options:
          - chrome
          - electron
          - firefox
  schedule:
    - cron: '42 0 * * 1,2,3,4,5,6'
      timezone: 'Europe/Paris'
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
  
    steps:

      - uses: actions/checkout@v7

      - name: Install dependencies
        run: npm install

      - name: Cypress on Chrome
        uses: cypress-io/github-action@v7
        with:
          config-file: cypress.config-github.ts
          config: baseUrl=${{ secrets.CYPRESS_BASE_URL }}
          browser: ${{ inputs.browser || 'chrome' }}
          spec: ${{ inputs.spec || '' }}
          quiet: true
        env:
          # If split_total is not defined, SPLIT is empty and cypress-split runs all specs without splitting
          SPLIT: ${{ inputs.split_total }}
          SPLIT_INDEX: ${{ inputs.split_index }}

          # pass the Cypress Cloud record key as an environment variable
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
          # ic3 related environment variables
          CYPRESS_ic3_user: ${{ secrets.IC3_USER }}
          CYPRESS_ic3_password: ${{ secrets.IC3_PASSWORD }}
          CYPRESS_GITHUB_ACTIONS: true
          CYPRESS_NO_PASSING: true
