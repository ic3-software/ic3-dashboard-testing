# This is a basic workflow that is manually triggered #

name: Cypress Manual
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
  
    steps:

      - uses: actions/checkout@v7

      - name: Install dependencies
        run: npm install

      - name: Cypress on Chrome
        uses: cypress-io/github-action@v7
        with:
          config-file: cypress.config-manual.ts
          config: baseUrl=${{ secrets.CYPRESS_BASE_URL }}
          browser: chrome
          quiet: true
        env:
          # pass the Cypress Cloud record key as an environment variable
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
          # ic3 related environment variables
          CYPRESS_ic3_user: ${{ secrets.IC3_USER }}
          CYPRESS_ic3_password: ${{ secrets.IC3_PASSWORD }}
          CYPRESS_GITHUB_ACTIONS: true
          CYPRESS_NO_PASSING: true

      - name: Upload corrupt PDF artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corrupt-pdfs
          path: '**/downloads/_corrupt-pdfs/**'
          if-no-files-found: ignore
          retention-days: 14